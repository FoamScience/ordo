name: release
on:
  push:
    branches: [main]
  # these build every target and stage every package without publishing
  # anything: a check that a release would still work
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - install.sh
      - release-please-config.json
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: always() && (needs.release-please.outputs.created == 'true' || github.event_name != 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          # static musl binaries run on any linux, whatever its glibc
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, cross: true }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      # tree-sitter-scss passes gcc's -Wno-unused-parameter to every compiler,
      # and msvc's cl rejects it; clang-cl takes it
      CC_x86_64_pc_windows_msvc: clang-cl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v6
        if: matrix.zig
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            uvx --from cargo-zigbuild cargo-zigbuild build --release --locked --features web --target ${{ matrix.target }}
          else
            cargo build --release --locked --features web --target ${{ matrix.target }}
          fi
      - name: Smoke test
        if: '!matrix.cross'
        shell: bash
        run: target/${{ matrix.target }}/release/ordo-engine --version
      - name: Package
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release"
          mkdir -p dist bins
          if [ "${{ runner.os }}" = Windows ]; then
            archive="ordo-${{ matrix.target }}.zip"
            (cd "$bin" && 7z a "$OLDPWD/dist/$archive" ordo.exe ordo-engine.exe)
            cp "$bin/ordo.exe" "$bin/ordo-engine.exe" bins/
          else
            archive="ordo-${{ matrix.target }}.tar.gz"
            tar -czf "dist/$archive" -C "$bin" ordo ordo-engine
            cp "$bin/ordo" "$bin/ordo-engine" bins/
          fi
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "$archive"; else shasum -a 256 "$archive"; fi > "$archive.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: bins/

  upload:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber -R "${{ github.repository }}"

  crates:
    needs: [release-please, build]
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          # a re-run after a later job failed finds this version already up
          if curl -sf "https://crates.io/api/v1/crates/ordo-diff/$VERSION" > /dev/null; then
            echo "ordo-diff $VERSION is already on crates.io"
          else
            cargo publish --locked
          fi

  npm:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
      - name: Stage
        run: node packaging/npm/stage.js "${{ needs.release-please.outputs.version || '0.0.0-dev' }}" bins out
      - name: Publish
        if: needs.release-please.outputs.created == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # the platform packages first: ordo-diff depends on them. A re-run
          # after a failure skips what is already up.
          for pkg in out/ordo-diff-*/ out/ordo-diff/; do
            spec=$(node -p "const p = require('./$pkg/package.json'); p.name + '@' + p.version")
            if npm view "$spec" version > /dev/null 2>&1; then
              echo "$spec is already on npm"
            else
              npm publish --provenance --access public "$pkg"
            fi
          done

  wheels:
    needs: [release-please, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins
      - name: Build one wheel per platform
        run: |
          vendor=packaging/pypi/ordo_diff/vendor
          while read -r target platform; do
            rm -rf "$vendor" && mkdir -p "$vendor"
            cp bins/bin-$target/* "$vendor/"
            chmod 755 "$vendor"/*
            ORDO_WHEEL_PLATFORM="$platform" uv build --wheel -o wheels packaging/pypi
          done <<'EOF'
          x86_64-unknown-linux-musl manylinux_2_17_x86_64.musllinux_1_1_x86_64
          aarch64-unknown-linux-musl manylinux_2_17_aarch64.musllinux_1_1_aarch64
          x86_64-apple-darwin macosx_10_12_x86_64
          aarch64-apple-darwin macosx_11_0_arm64
          x86_64-pc-windows-msvc win_amd64
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: wheels/

  pypi:
    needs: [release-please, wheels]
    if: always() && needs.wheels.result == 'success' && needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
