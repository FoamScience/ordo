# Real-world corpora for polishing ordo's rationale quality — one per supported
# language, chosen for disciplined single-concern commits (so a rationale has a
# right answer to judge against) and idiomatic code (so tree-sitter node kinds
# get exercised naturally).
#
# These are NOT vendored. `scripts/corpus-fetch.sh` clones them into
# $ORDO_CORPUS (default ~/.cache/ordo-corpus); `tests/corpus.rs` skips entirely
# when that directory is absent, so the normal test run stays hermetic, offline
# and fast.
#
# `rev` is pinned on purpose: an unpinned upstream would drift the recorded
# baseline for reasons that have nothing to do with ordo. Bump it deliberately,
# then re-record with UPDATE_CORPUS_BASELINE=1.
#
# `max_commits` is lower for the big repos so a full sweep stays minutes rather
# than tens of minutes. It must not exceed the clone depth: a commit whose parent
# is beyond the shallow boundary is SKIPPED (diffing it against the empty tree
# would sweep the whole file as one synthetic "everything added" hunk and skew
# every metric), so an over-large cap silently sweeps fewer commits than it says.
# `scripts/corpus-fetch.sh` clones deep enough for these values.

[[repo]]
name = "click"
lang = "python"
url = "https://github.com/pallets/click.git"
rev = "36baa15ff831b939a22bc527cd76ce653ef6f66d"
max_commits = 350
# decorator-heavy (@click.command) — exercises decorated_definition naming

[[repo]]
name = "ripgrep"
lang = "rust"
url = "https://github.com/BurntSushi/ripgrep.git"
rev = "3fce3b5bb0236da2df6d99672afb8a719642eca7"
max_commits = 350
# const/static and generic `impl` blocks; unusually explanatory commit messages

[[repo]]
name = "curl"
lang = "c"
url = "https://github.com/curl/curl.git"
rev = "f8992b6a177a2ccfb5dc04137088534bad68681c"
