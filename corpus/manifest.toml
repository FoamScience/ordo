# the reference for C commit discipline; also ~900 .md files, so it exercises
# the markdown path harder than any other entry

[[repo]]
name = "openfoam"
lang = "cpp"
url = "https://github.com/OpenFOAM/OpenFOAM-dev.git"
rev = "09951d6e6b9e0fb45834507abf5bc5fea718330d"
max_commits = 200
# 9.4k C++ files in the `.C`/`.H` house style gcc treats as C++ — the reason
# those extensions are mapped at all. Strict `Component: what changed` commit
# messages and a median of 4 files per commit, though a sweeping refactor can
# touch 300+, so this one is the slowest entry (~450ms/commit).

