<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="ordo-defuse-title ordo-defuse-desc">
  <title id="ordo-defuse-title">Definitions before their uses, across files</title>
  <desc id="ordo-defuse-desc">A real ordo run on a two-file change: main.py uses helper(), util.py defines it. Diffed order lists main.py first; ordo's comprehension order puts util.py's definition first, linked to its use by a def-to-use edge.</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fd4c0"/>
    </marker>
  </defs>

  <rect width="1200" height="440" rx="28" fill="#0a0c10"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="27.5" fill="none" stroke="#1c222b" stroke-width="1"/>

  <g transform="translate(60,50)">
    <text class="sans" x="0" y="0" font-size="30" font-weight="700" fill="#f5f7f9">P2 — definitions read before their uses</text>
    <text class="mono" x="0" y="30" font-size="14.5" fill="#7c8591">real ordo output on a two-file change · cross_file: true</text>
  </g>

  <!-- column headers -->
  <g class="mono" font-size="15" fill="#7c8591">
    <text x="60" y="122">as diffed (file order)</text>
    <text x="660" y="122">ordo comprehension order</text>
  </g>
  <line x1="60" y1="136" x2="500" y2="136" stroke="#232a33"/>
  <line x1="660" y1="136" x2="1140" y2="136" stroke="#232a33"/>

  <!-- LEFT: as diffed -->
  <g transform="translate(60,156)">
    <!-- card 1: main.py h0, uses helper -->
    <rect x="0" y="0" width="440" height="92" rx="10" fill="#10141a" stroke="#3a2a24"/>
    <text class="mono" x="18" y="26" font-size="13" fill="#8b93a0">main.py · h0 · other</text>
    <text class="mono" x="18" y="52" font-size="18" fill="#f2836b">x = helper()</text>
    <text class="mono" x="18" y="76" font-size="14" fill="#7c8591">uses: helper</text>

    <!-- card 2: util.py h1, defines helper -->
    <rect x="0" y="112" width="440" height="92" rx="10" fill="#10141a" stroke="#1f3a34"/>
    <text class="mono" x="18" y="138" font-size="13" fill="#8b93a0">util.py · h1 · definition</text>
    <text class="mono" x="18" y="164" font-size="18" fill="#5fd4c0">def helper(): return 1</text>
    <text class="mono" x="18" y="188" font-size="14" fill="#7c8591">defines: helper</text>
  </g>

  <!-- RIGHT: comprehension order (swapped) -->
  <g transform="translate(660,156)">
    <!-- card 1: util.py h1 first -->
    <rect x="0" y="0" width="440" height="92" rx="10" fill="#10141a" stroke="#5fd4c0" stroke-width="1.5"/>
    <text class="mono" x="18" y="26" font-size="13" fill="#8b93a0">util.py · h1 · definition</text>
    <text class="mono" x="18" y="52" font-size="18" fill="#5fd4c0">def helper(): return 1</text>
    <text class="mono" x="18" y="76" font-size="14" fill="#c7cdd6">rationale: adds helper, used in main.py</text>

    <!-- card 2: main.py h0 second -->
    <rect x="0" y="112" width="440" height="92" rx="10" fill="#10141a" stroke="#f2836b" stroke-width="1.5"/>
    <text class="mono" x="18" y="138" font-size="13" fill="#8b93a0">main.py · h0 · other</text>
    <text class="mono" x="18" y="164" font-size="18" fill="#f2836b">x = helper()</text>
    <text class="mono" x="18" y="188" font-size="14" fill="#c7cdd6">rationale: uses helper, defined in util.py</text>
  </g>

  <!-- swap arrows between columns -->
  <path d="M 500,180 C 570,180 590,248 660,248" fill="none" stroke="#5fd4c0" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 500,292 C 570,292 590,180 660,180" fill="none" stroke="#3a4048" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- edge label -->
  <g transform="translate(60,392)" class="mono" font-size="14.5">
    <text x="0" y="0" fill="#7c8591">edges: [ h1 → h0 ]   why: "def→use: helper"</text>
    <text x="620" y="0" fill="#7c8591">clusters: [ [h0, h1] ] — one connected change</text>
  </g>
</svg>
