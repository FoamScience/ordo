[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained; transitive via bm25 (web feature), no fixed version" },
    { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; transitive via tokenizers (m2v experiment), no fixed version" },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is unmaintained; transitive via tokenizers (m2v experiment), no fixed version" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
