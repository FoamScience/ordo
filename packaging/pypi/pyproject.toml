[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ordo-diff"
version = "0.6.1"
description = "Review a code change in reading order: definitions before their uses"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/FoamScience/ordo"

[project.scripts]
ordo = "ordo_diff.__main__:ordo"
ordo-engine = "ordo_diff.__main__:engine"

[tool.hatch.build.targets.wheel]
packages = ["ordo_diff"]
# the release workflow drops the platform's binaries here before building,
# with ORDO_WHEEL_PLATFORM naming the platform tag they are for
artifacts = ["ordo_diff/vendor/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
