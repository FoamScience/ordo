[package]
name = "ordo"
version = "0.2.0"
edition = "2021"
description = "Comprehension-optimized ordering of code-change hunks"
license = "MIT"

# The engine CLI — the JSON API (`ordo-engine order --json`), what the npm and
# pypi wrappers shell to. Pure: no git, no config.
[[bin]]
name = "ordo-engine"
path = "src/main.rs"

# The reviewer — `ordo`. A first-party client of the engine that shells to git
# and reads config; on by default, `--no-default-features` builds the engine alone.
[[bin]]
name = "ordo"
path = "src/bin/ordo.rs"
required-features = ["tui"]

[[bench]]
name = "corpus"
harness = false

[lib]
name = "ordo"
path = "src/lib.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:tree-sitter-highlight", "dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
# rule `path`/name predicates (see model::When) — pure matching, no I/O
globset = "0.4"
# rule `text` / `text-not` predicates; already in the tree via tree-sitter
regex = "1"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-xonsh = "0.2.3"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.3"
diffy = "0.5.0"
ratatui = { version = "0.29", optional = true }
tree-sitter-highlight = { version = "0.25", optional = true }
tree-sitter-toml-ng = "0.7"
# rules-file parsing (the `ordo` reviewer only, see model::Rule)
toml = { version = "0.8", optional = true }
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-jinja = "0.13"
tree-sitter-ini = "1.4"
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-bash = "0.25"

[dev-dependencies]
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
