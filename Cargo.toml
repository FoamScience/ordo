[package]
name = "ordo-diff"
version = "0.5.0"
edition = "2021"
rust-version = "1.90"
description = "Comprehension-optimized ordering of code-change hunks"
license = "MIT"
repository = "https://github.com/FoamScience/ordo"
homepage = "https://github.com/FoamScience/ordo"
documentation = "https://docs.rs/ordo-diff"
readme = "README.md"
keywords = ["diff", "code-review", "tree-sitter", "git"]
categories = ["development-tools", "command-line-utilities", "parser-implementations"]
include = [
    "/src/**/*.rs",
    "/src/catalog.generated.json",
    "/build.rs",
    "/grammars/tree-sitter-go-template/src/**",
    "/grammars/tree-sitter-go-template/LICENSE*",
    "/docs/*.md",
    "/rulesets/*.toml",
    "/web/dist/**",
    "/README.md",
    "/LICENSE",
]

# The engine CLI — the JSON API (`ordo-engine order --json`), what the npm and
# pypi wrappers shell to. Pure: no git, no config.
[[bin]]
name = "ordo-engine"
path = "src/main.rs"

# The reviewer — `ordo`. A first-party client of the engine that shells to git,
# reads config and serves the review to a browser; behind `web` so library
# users get the engine alone.
[[bin]]
name = "ordo"
path = "src/bin/ordo/main.rs"
required-features = ["web"]

[[bench]]
name = "corpus"
harness = false

[[test]]
name = "web"
required-features = ["web"]

[lib]
path = "src/lib.rs"

[features]
default = []
# `ordo`: the reviewer, served to a browser from the same binary
web = ["dep:tree-sitter-highlight", "dep:toml", "dep:tiny_http", "dep:bm25"]
# experiment: static-embedding similarity between hunks (examples/m2v.rs only)
m2v = ["dep:model2vec-rs"]

[[example]]
name = "m2v"
required-features = ["m2v"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
# rule `path`/name predicates (see model::When) — pure matching, no I/O
globset = "0.4"
# rule `text` / `text-not` predicates; already in the tree via tree-sitter
regex = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-xonsh = "0.2.3"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.3"
diffy = "0.5.0"
tree-sitter-highlight = { version = "0.27", optional = true }
tree-sitter-toml-ng = "0.7"
# rules-file parsing (the `ordo` reviewer only, see model::Rule)
toml = { version = "1", optional = true }
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-jinja = "0.13"
tree-sitter-ini = "1.4"
tree-sitter-cmake = "0.7"
tree-sitter-make = "1.1"
tree-sitter-nix = "0.3"
tree-sitter-jsonnet = "0.0.1"
tree-sitter-bash = "0.25"
tree-sitter-embedded-template = "0.25"
tree-sitter-css = "0.25"
tree-sitter-scss = "1.0"
tree-sitter-rst = "0.2"
tree-sitter-html = "0.23"
tree-sitter-svelte-ng = "1.0"
# the reviewer's localhost server: synchronous, no async runtime
tiny_http = { version = "0.12", default-features = false, optional = true }
# the palette finder's hunk ranking (Okapi BM25), with ordo's own tokenizer
bm25 = { version = "2.3.2", default-features = false, optional = true }
model2vec-rs = { version = "0.4", default-features = false, features = ["onig"], optional = true }

[build-dependencies]
# builds the in-tree go-template grammar (see grammars/ and build.rs)
cc = "1"

[dev-dependencies]
toml = "1"

[package.metadata.docs.rs]
features = ["web"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
