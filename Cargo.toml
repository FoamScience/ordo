[package]
name = "ordo"
version = "0.1.0"
edition = "2021"
description = "Comprehension-optimized ordering of code-change hunks"
license = "MIT"

[[bin]]
name = "ordo"
path = "src/main.rs"

[lib]
name = "ordo"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tree-sitter = "0.25"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-lua = "0.5.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
